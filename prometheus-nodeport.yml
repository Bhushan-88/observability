apiVersion: v1
kind: Service

metadata:
  name: prometheus-nodeport
  namespace: monitoring

spec:
  type: NodePort

  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus-kube-prometheus-prometheus

  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30090